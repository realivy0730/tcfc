# .github/workflows/deploy.yml
# ==============================================================================
# 🔐 Secret Architecture Note (Ref: ISSUE-096 / 本機 ~/credentials/tcfc-credentials-log.md)
# 1. Cloudflare family: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (discrete keys,
#    injected only into the deploy step; never echoed to logs).
# 2. Google family: VITE_GOOGLE_SHEETS_API_KEY — public read-only key by design
#    (bundled into frontend); stored as secret for rotation & consistency
#    (not secrecy. Phase 5 GAS proxy will remove it entirely — Issue #7).
# DO NOT merge families. Never print secrets in this workflow.
# ==============================================================================
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          VITE_GOOGLE_SHEETS_API_KEY: ${{ secrets.VITE_GOOGLE_SHEETS_API_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name tcfc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}